services:

  gini-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-gini}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gini_dev_password}
      POSTGRES_DB: ${DB_NAME:-gini}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gini}"]
      interval: 5s
      timeout: 3s
      retries: 5

  gini-redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gini-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-gini}:${DB_PASSWORD:-gini_dev_password}@gini-db:5432/${DB_NAME:-gini}
      REDIS_URL: redis://gini-redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://gini.tail3d4a2.ts.net}
    volumes:
      - ./settings.yaml:/app/settings.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      gini-db:
        condition: service_healthy
      gini-redis:
        condition: service_healthy
    networks:
      - default
      - marketsim
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  gini-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ""
    depends_on:
      gini-backend:
        condition: service_healthy

  gini-proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - gini-frontend
      - gini-backend

  gini-tailscale:
    image: tailscale/tailscale:stable
    hostname: gini
    environment:
      # Only needed on first start; node identity persists in the tailscale-state volume.
      # Optional after registration — leave blank in .env to reuse the persisted identity.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: gini
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on:
      - gini-proxy
    restart: unless-stopped

networks:
  default:
    # Internal network for services
  sandbox:
    # Sandbox network — internet access, no access to internal services
    driver: bridge
    internal: false
  marketsim:
    # External: MarketSimulator's docker network so gini-backend can reach marketsim-backend
    name: marketsimulator_default
    external: true

volumes:
  pgdata:
  redisdata:
  tailscale-state:
